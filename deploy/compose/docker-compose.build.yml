# Builds the images from this checkout instead of pulling them:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  migrate:
    build: &build
      context: ../..
      dockerfile: deploy/compose/Dockerfile
  forecrewd:
    build: *build
  control-init:
    build: &control_build
      context: ../..
      dockerfile: deploy/worker/control/Dockerfile
  worker-control:
    build: *control_build
