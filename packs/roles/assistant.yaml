role: assistant
model: strong
prompt: roles/assistant.md
tools: [config.read, config.plan, models.suggest, ask_human, assumption.record, kb.search]
write_paths: []
produces: [config_plan]
output_schema: schemas/assistant.json
pool: control
definition_of_done:
  - every change proposed is a plan from config_plan, built only from what the schema has
  - the reply says in plain words what the plan does and that nothing changes until the person confirms it
  - the reply is in the language the person writes in
escalate_when:
  - what the person wants cannot be done with the resources in the schema
max_turns: 25
timeout: 10m
