name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: ./.github/actions/web-setup
      - run: make build
      - run: make test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forecrew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORECREW_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/forecrew_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: ./.github/actions/web-setup
      - run: make test-integration
      - run: make cover

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/web-setup
      - run: make web-lint web-cover
      - run: make web
      - run: cd web && pnpm exec playwright install --with-deps chromium
      - run: make e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck deploy/backup/*.sh deploy/tests/*.sh deploy/worker/*.sh deploy/worker/control/*.sh
      - name: backup script
        run: deploy/tests/backup_test.sh
      - name: worker install script
        run: deploy/tests/install_test.sh

  compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/compose
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
    steps:
      - uses: actions/checkout@v7
      - name: Write .env, garage.env and forecrew.yaml
        run: |
          key="$(openssl genrsa -traditional 2048 | awk 'NF{printf "%s\\n", $0}')"
          {
            echo "POSTGRES_PASSWORD=ci-password"
            echo "FORECREW_GITHUB_PRIVATE_KEY=\"$key\""
            echo "FORECREW_GITHUB_WEBHOOK_SECRET=ci-secret"
            echo "ANTHROPIC_API_KEY=ci-anthropic"
            echo "CODEX_API_KEY=ci-codex"
            echo "FORECREW_EVIDENCE_ACCESS_KEY_ID=GK$(openssl rand -hex 12)"
            echo "FORECREW_EVIDENCE_SECRET_ACCESS_KEY=$(openssl rand -hex 32)"
            echo "FORECREW_HTTP_PORT=8080"
            echo "FORECREW_HTTPS_PORT=8443"
          } > .env
          {
            echo "GARAGE_RPC_SECRET=$(openssl rand -hex 32)"
            echo "GARAGE_ADMIN_TOKEN=$(openssl rand -hex 32)"
          } > garage.env
          cp forecrew.example.yaml forecrew.yaml
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120 postgres
      - name: Start forecrewd and wait for its health check
        run: docker compose up -d --wait --wait-timeout 120 forecrewd
      - name: healthz
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: web UI at /
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsSI http://localhost:8080/some/page | grep -qi '^content-security-policy: default-src'
      - name: forecrew CLI in the image
        run: |
          docker compose exec -T forecrewd forecrew config validate --config /etc/forecrew/forecrew.yaml
          docker compose exec -T forecrewd forecrew token create ci
      - if: always()
        run: docker compose down -v

  control-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: deploy/tests/control_worker_test.sh

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path deploy/worker/install.ps1 -Severity Warning, Error
          $findings | Format-List
          if ($findings) { exit 1 }

  e2e-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forecrew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORECREW_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/forecrew_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: make test-e2e
