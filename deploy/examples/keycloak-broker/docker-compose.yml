# Keycloak as the OIDC broker in front of a SAML identity provider
# (docs/enterprise.md, SAML). For trying it out: start-dev keeps data in the
# container and serves plain HTTP. In production run `start` behind TLS,
# because Forecrew needs an https issuer.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./forecrew-realm.json:/opt/keycloak/data/import/forecrew-realm.json:ro
