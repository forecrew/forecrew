# Garage, the S3-compatible object store of the evidence (artifacts), as a
# single node. The RPC secret and the admin token come from the environment
# (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN), never from this file.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
