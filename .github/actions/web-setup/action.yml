name: web-setup
description: Node and pnpm for the web UI (web/), with the pnpm store cached.
runs:
  using: composite
  steps:
    # Third-party actions are pinned by commit SHA; update the SHA with the comment.
    - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
