description: The goal playbook with councils and learning, the full feature workflow. Like goal-v2 (the testing system and the verification report that gates every merge), and after the intake a triage job sizes the goal (a human who set the councils skips it), a product council answers whether to build it before the spec, a technical council designs it after the spec is approved, the architect records an architectural decision as an ADR, and when every task is merged the learn step closes the goal with a retro. A failed learn step asks a human and approving skips it. A human who merges a PR on GitHub is not stopped by the verification report, as in goal-v2.
inputs: [repo, goal_id, platforms]
steps:
  # The goal's GitHub issue, with the labels of the playbook.
  - id: intake
    type: action
    action: goal.intake
    with: {repo: '${inputs.repo}', goal_id: '${inputs.goal_id}'}
    on_failure: escalate

  # The size of the goal: its triage, which decides the councils (config
  # sizing). A goal that has a size, because a human chose its councils when
  # creating it, has no triage job.
  - id: sized
    type: action
    action: goal.untriaged
    with: {goal_id: '${inputs.goal_id}'}
    on_failure: escalate
  - id: triage
    type: foreach
    items: '${steps.sized.output.if_triage}'
    steps:
      - id: triage_job
        type: job
        with: {role: triage, repo: '${inputs.repo}', goal_id: '${inputs.goal_id}'}
        on_failure: escalate
  - id: size
    type: action
    action: goal.size
    with: {goal_id: '${inputs.goal_id}', triage: '${steps.triage.output.0.triage_job.output}'}
    on_failure: escalate

  # The product council, when the goal is sized in: its brief is in the
  # decisions the product owner's job reads and is linked in the spec gate.
  # A council that fails (its brief rejected) stops the run.
  - id: product
    type: foreach
    items: '${steps.size.output.if_product}'
    steps:
      - id: product_constraints
        type: action
        action: goal.council_constraints
        with: {goal_id: '${item}'}
      - id: product_ask
        type: action
        action: council.run
        with:
          kind: product
          question: Should we build this, and what exactly?
          constraints: '${steps.product_constraints.output.constraints}'
      - id: product_decided
        type: wait
        with: {signal: council.decided, council_id: '${steps.product_ask.output.council_id}'}

  # One round per review: write the spec, put it in the goal issue, ask for
  # approval. Changes requested start a new round with the feedback; the
  # fourth round needs a needs_you gate, as every one after it.
  - id: spec
    type: loop
    max_iterations: 3
    until: steps.spec_gate.output.decision == approved
    on_failure: escalate
    steps:
      - id: write
        type: job
        with:
          role: product-owner
          repo: '${inputs.repo}'
          goal_id: '${inputs.goal_id}'
          feedback: '${steps.spec_gate.output.feedback}'
        on_failure: escalate
      - id: render
        type: action
        action: goal.spec
        with: {goal_id: '${inputs.goal_id}', job_id: '${steps.write.job_id}', spec: '${steps.write.output}'}
        on_failure: escalate
      - id: spec_gate
        type: gate
        with:
          kind: spec_approval
          title: 'Approve the spec (revision ${steps.render.output.revision})'
          summary: '${steps.render.output.summary}'
          subject_repo: '${inputs.repo}'
          subject_number: '${steps.intake.output.issue_number}'
          spec_id: '${steps.render.output.spec_id}'

  # The technical council, when the goal is sized in: its brief and decision
  # are in the decisions the architect's job reads.
  - id: technical
    type: foreach
    items: '${steps.size.output.if_technical}'
    steps:
      - id: technical_constraints
        type: action
        action: goal.council_constraints
        with: {goal_id: '${item}'}
      - id: technical_ask
        type: action
        action: council.run
        with:
          kind: technical
          question: How should we build it?
          constraints: '${steps.technical_constraints.output.constraints}'
      - id: technical_decided
        type: wait
        with: {signal: council.decided, council_id: '${steps.technical_ask.output.council_id}'}

  # The tasks of the approved spec, each with an issue under the goal's. The
  # architect gets a second try, with what is wrong with its plan (such as
  # the criteria no task covers); after that a needs_you gate asks a human and
  # approving it reruns the architect once more.
  - id: architecture
    type: loop
    max_iterations: 2
    until: steps.plan.output.valid
    on_failure: escalate
    steps:
      # After a technical council the decision is architectural: the job may
      # write docs/adr/** on the branch agent/adr-GOAL-n, in a pool that gets
      # a write token, and is told to. Otherwise it stays read-only.
      - id: adr
        type: action
        action: goal.adr
        with: {goal_id: '${inputs.goal_id}'}
        on_failure: escalate
      - id: design
        type: job
        with:
          role: architect
          repo: '${inputs.repo}'
          goal_id: '${inputs.goal_id}'
          spec_id: '${steps.render.output.spec_id}'
          feedback: '${steps.plan.output.errors}'
          pool: '${steps.adr.output.pool}'
          branch: '${steps.adr.output.branch}'
          write_paths: '${steps.adr.output.write_paths}'
          prompt: If you are allowed to write files, the technical council decided the design, and you record it as an architecture decision record in docs/adr/ (the next free number, a title in the file name), with the context, the decision, the options not taken and the consequences. Write nothing else, and do not write it when you may not write files.
        on_failure: escalate
      - id: plan
        type: action
        action: goal.plan
        with:
          goal_id: '${inputs.goal_id}'
          spec_id: '${steps.render.output.spec_id}'
          platforms: '${inputs.platforms}'
          plan: '${steps.design.output}'
          spec: '${steps.write.output}'
        on_failure: escalate

  # The ADR the architect wrote, if any: a PR a human approves and merges.
  - id: adr_found
    type: action
    action: goal.adr_ready
    with: {goal_id: '${inputs.goal_id}'}
    on_failure: escalate
  - id: adr_delivery
    type: foreach
    items: '${steps.adr_found.output.if_adr}'
    steps:
      - id: adr_pr
        type: action
        action: github.open_or_update_pr
        with:
          repo: '${inputs.repo}'
          title: '${steps.adr_found.output.title}'
          body: '${steps.adr_found.output.body}'
          head: '${item}'
          base: '${steps.intake.output.default_branch}'
        on_failure: escalate
      - id: adr_checks
        type: wait
        timeout: 1h
        on_failure: escalate
        with: {signal: checks.completed, repo: '${inputs.repo}', sha: '${steps.adr_found.output.sha}'}
      - id: adr_gate
        type: gate
        with:
          kind: merge_approval
          title: 'Merge the ADR of the goal'
          summary: "The architect recorded the technical council's decision as an architecture decision record on ${item}. Approve to merge it; reject to stop the run, which leaves the pull request open."
          subject_repo: '${inputs.repo}'
          subject_number: '${steps.adr_pr.output.number}'
      - id: adr_verdict
        type: action
        action: goal.if_approved
        with: {decision: '${steps.adr_gate.output.decision}', number: '${steps.adr_pr.output.number}'}
      - id: adr_merge_if
        type: foreach
        items: '${steps.adr_verdict.output.if_approved}'
        steps:
          - id: adr_merge
            type: action
            action: github.merge_pr
            with: {repo: '${inputs.repo}', number: '${item}', sha: '${steps.adr_found.output.sha}'}
            on_failure: escalate

  # The tasks one after the other. Inside a foreach over a list, ${item} is
  # that list's element, so the steps of the inner foreaches read the task
  # from the outputs of "round".
  - id: tasks
    type: foreach
    items: '${steps.plan.output.tasks}'
    steps:
      # The tests of the task, from its criteria, before any code: a test
      # engineer writes them on the task's branch. One that stops because the
      # matrix or a suite must change first is answered by the test architect
      # (a foreach over what tests.map names), and the engineer then runs
      # again with the escalation as feedback. The second round that is not
      # ready needs a needs_you gate.
      - id: tests
        type: loop
        max_iterations: 2
        until: steps.tmap.output.ready
        on_failure: escalate
        steps:
          - id: write_tests
            type: job
            with:
              role: test-engineer
              repo: '${inputs.repo}'
              branch: '${item.branch}'
              needs: '${item.needs}'
              task_id: '${item.id}'
              spec_id: '${steps.render.output.spec_id}'
              feedback: '${steps.tmap.output.feedback}'
            on_failure: escalate
          - id: tmap
            type: action
            action: tests.map
            with: {task_id: '${item.id}', needs: '${item.needs}', repo: '${inputs.repo}'}
            on_failure: escalate
          - id: matrix_work
            type: foreach
            items: '${steps.tmap.output.if_architect}'
            steps:
              - id: test_plan
                type: job
                with:
                  role: test-architect
                  repo: '${inputs.repo}'
                  branch: '${item.branch}'
                  needs: '${item.needs}'
                  task_id: '${item.task_id}'
                  spec_id: '${steps.render.output.spec_id}'
                  feedback: '${steps.tmap.output.feedback}'
                on_failure: escalate
      # One delivery per merge decision: build a PR that passes its checks
      # and its review, then ask a human to merge it. Changes requested at
      # the gate start a new delivery with the feedback; the sixth needs a
      # needs_you gate.
      - id: delivery
        type: loop
        max_iterations: 5
        until: steps.done.output.done
        on_failure: escalate
        steps:
          # One round per developer job. A round whose checks failed or whose
          # review asks for changes is followed by a rework round with their
          # feedback; the fourth round needs a needs_you gate.
          - id: build
            type: loop
            max_iterations: 3
            until: steps.assess.output.done
            on_failure: escalate
            steps:
              - id: round
                type: action
                action: goal.round
                with:
                  task_id: '${item.id}'
                  iteration: '${iteration}'
                  human: '${steps.done.output.feedback}'
                  review: '${steps.assess.output.feedback}'
              # A developer that stops with an escalation leaves no PR text
              # (pr_text comments the reason on the task's issue). A needs_you
              # gate then shows the escalation and says what approving does:
              # the developer runs again without the lock on the tests for
              # that round, with the human's note; the lock is back in the
              # next round. Rejecting stops the run. A developer that changes
              # a locked test fails its job instead, which opens a needs_you
              # gate of its own, and the rerun keeps the lock.
              - id: dev
                type: loop
                max_iterations: 2
                until: steps.pr_text.output.ready
                on_failure: escalate
                steps:
                  - id: locked
                    type: action
                    action: tests.locked_paths
                    with:
                      task_id: '${item.id}'
                      iteration: '${iteration}'
                      decision: '${steps.lock_ask.output.0.lock_gate.output.decision}'
                      feedback: '${steps.lock_ask.output.0.lock_gate.output.feedback}'
                      base: '${steps.round.output.feedback}'
                  - id: develop
                    type: job
                    with:
                      role: developer
                      repo: '${inputs.repo}'
                      branch: '${steps.round.output.branch}'
                      needs: '${item.needs}'
                      task_id: '${item.id}'
                      spec_id: '${steps.render.output.spec_id}'
                      feedback: '${steps.locked.output.feedback}'
                      locked_paths: '${steps.locked.output.locked_paths}'
                    on_failure: escalate
                  - id: pr_text
                    type: action
                    action: goal.pr_text
                    with: {task_id: '${item.id}', result: '${steps.develop.output}'}
                  - id: lock_ask
                    type: foreach
                    items: '${steps.pr_text.output.if_escalated}'
                    steps:
                      - id: lock_gate
                        type: gate
                        with:
                          kind: needs_you
                          title: 'The developer of ${steps.round.output.ref} stopped and asks for a decision'
                          summary: "The developer escalated:\n\n${item}\n\nThe tests written from the spec are locked: the developer may not change them. If it believes one is wrong, this is about it.\n\nApprove to run the developer again WITHOUT the lock on those tests for one round; your note goes to the developer, and the merge gate will say that a round ran without the lock. Reject to stop the run."
                          subject_repo: '${inputs.repo}'
                          task_id: '${steps.round.output.task_id}'
              - id: pr
                type: action
                action: github.open_or_update_pr
                with:
                  repo: '${inputs.repo}'
                  title: '${steps.pr_text.output.title}'
                  body: '${steps.pr_text.output.body}'
                  head: '${steps.round.output.branch}'
                  base: '${steps.intake.output.default_branch}'
                  # The earlier round's PR: closed on GitHub fails the run;
                  # merged there skips the steps below (the list is empty).
                  previous: '${steps.pr.output.number}'
                  task_id: '${item.id}'
              - id: gated
                type: foreach
                items: '${steps.pr.output.if_open}'
                steps:
                  - id: in_review
                    type: action
                    action: goal.task_move
                    with: {task_id: '${steps.round.output.task_id}', to: in_review}
                  # The checks of the PR head; "none" means the repo has no
                  # checks. A timeout opens a needs_you gate.
                  - id: checks
                    type: wait
                    timeout: 1h
                    on_failure: escalate
                    with: {signal: checks.completed, repo: '${inputs.repo}', sha: '${steps.develop.head_sha}'}
                  # The verification of the head: the required cells of the
                  # matrix plus the suites of the new tests, the new tests on
                  # the base branch, one rerun of the failed cells, and the
                  # report. Only jobs a worker can run are started, since a
                  # queued job nobody can lease would hold the run forever;
                  # a report that is still incomplete (a missing worker, a
                  # base check without its runs) opens a needs_you gate that
                  # names what is missing, and approving it runs the matrix
                  # again, at most three times before the loop's own gate.
                  - id: verify
                    type: loop
                    max_iterations: 3
                    until: steps.status.output.complete
                    on_failure: escalate
                    steps:
                      - id: vtests
                        type: action
                        action: tests.map
                        with: {task_id: '${steps.round.output.task_id}'}
                      - id: mplan
                        type: action
                        action: matrix.plan
                        with:
                          repo: '${inputs.repo}'
                          ref: '${steps.develop.head_sha}'
                          scope: required
                          suites: '${steps.vtests.output.suites}'
                          only_runnable: true
                          strict: true
                        on_failure: escalate
                      - id: cells
                        type: foreach
                        parallel: 8
                        items: '${steps.mplan.output.jobs}'
                        steps:
                          - id: cell_run
                            type: job
                            with:
                              kind: command
                              repo: '${inputs.repo}'
                              base_ref: '${steps.develop.head_sha}'
                              task_id: '${steps.round.output.task_id}'
                              from: '${item}'
                            on_failure: escalate
                      # Every new test must fail on the base branch without
                      # the change, with the test files laid over it.
                      - id: base_request
                        type: action
                        action: tests.base_check_request
                        with:
                          repo: '${inputs.repo}'
                          base: '${steps.intake.output.default_branch}'
                          head: '${steps.develop.head_sha}'
                          tests: '${steps.vtests.output.tests}'
                          files: '${steps.vtests.output.files}'
                          only_runnable: true
                        on_failure: escalate
                      - id: base_cells
                        type: foreach
                        parallel: 8
                        items: '${steps.base_request.output.runnable}'
                        steps:
                          - id: base_run
                            type: job
                            with:
                              kind: command
                              repo: '${inputs.repo}'
                              base_ref: '${steps.intake.output.default_branch}'
                              overlay: '${item.overlay}'
                              task_id: '${steps.round.output.task_id}'
                              from: '${item}'
                            on_failure: escalate
                      - id: base_result
                        type: action
                        action: tests.base_check_result
                        with:
                          runs: '${steps.base_cells.output}'
                          tests: '${steps.vtests.output.tests}'
                          requests: '${steps.base_request.output.requests}'
                      - id: first
                        type: action
                        action: verification.build
                        with:
                          change: '${steps.pr.output.number}'
                          sha: '${steps.develop.head_sha}'
                          task_id: '${steps.round.output.task_id}'
                          base_check: '${steps.base_result.output}'
                        on_failure: escalate
                      # A cell that failed runs once more: a test that then
                      # passes is flaky and does not block.
                      - id: reruns
                        type: action
                        action: verification.rerun_cells
                        with: {report_id: '${steps.first.output.report_id}'}
                      - id: rerun_cells
                        type: foreach
                        parallel: 8
                        items: '${steps.reruns.output.requests}'
                        steps:
                          - id: rerun_run
                            type: job
                            with:
                              kind: command
                              repo: '${inputs.repo}'
                              base_ref: '${steps.develop.head_sha}'
                              task_id: '${steps.round.output.task_id}'
                              from: '${item}'
                            on_failure: escalate
                      - id: final
                        type: action
                        action: verification.build
                        with:
                          change: '${steps.pr.output.number}'
                          sha: '${steps.develop.head_sha}'
                          task_id: '${steps.round.output.task_id}'
                          base_check: '${steps.base_result.output}'
                        on_failure: escalate
                      - id: status
                        type: action
                        action: verification.read
                        with: {change: '${steps.pr.output.number}', sha: '${steps.develop.head_sha}'}
                      - id: workers
                        type: foreach
                        items: '${steps.status.output.if_incomplete}'
                        steps:
                          - id: workers_gate
                            type: gate
                            with:
                              kind: needs_you
                              title: 'Verification of ${steps.round.output.ref} is incomplete'
                              summary: "${steps.status.output.text}\n\n${steps.mplan.output.missing}\n${steps.base_request.output.missing}\n\nBring a worker with those labels online, or fix what is missing, then approve to run the matrix again. Reject to stop the run."
                              subject_repo: '${inputs.repo}'
                              subject_number: '${steps.pr.output.number}'
                              task_id: '${steps.round.output.task_id}'
                  # The reviewer only reads the branch and only comments; it
                  # is told what the verification found.
                  - id: review
                    type: job
                    with:
                      role: reviewer
                      repo: '${inputs.repo}'
                      branch: '${steps.round.output.branch}'
                      task_id: '${steps.round.output.task_id}'
                      spec_id: '${steps.render.output.spec_id}'
                      feedback: '${steps.status.output.text}'
                    on_failure: escalate
                  - id: post
                    type: action
                    action: goal.review_post
                    with: {repo: '${inputs.repo}', number: '${steps.pr.output.number}', review: '${steps.review.output}'}
                  # A human accepts or rejects the high-impact assumptions the
                  # task rests on before the round is assessed; the gates were
                  # opened when the jobs that stated them finished. The loop
                  # asks again after every decision, because a human who asks
                  # for changes opens a new review; it ends when no review is
                  # pending or the PR was merged or closed on GitHub (which
                  # also sends back the task's reviews). A wait that nobody
                  # answers opens a needs_you gate.
                  - id: reviewed
                    type: loop
                    max_iterations: 10
                    until: steps.hold.output.clear
                    on_failure: escalate
                    steps:
                      - id: hold
                        type: action
                        action: goal.hold
                        with: {task_id: '${steps.round.output.task_id}', repo: '${inputs.repo}', number: '${steps.pr.output.number}'}
                      - id: waiting
                        type: foreach
                        items: '${steps.hold.output.gates}'
                        steps:
                          - id: assumption_wait
                            type: wait
                            timeout: 72h
                            on_failure: escalate
                            with: {signal: gate.resolved, gate_id: '${item}'}
              # Done when the PR is ready for the merge gate or merged on
              # GitHub; otherwise it outputs the feedback of the rework.
              - id: assess
                type: action
                action: goal.assess
                with:
                  repo: '${inputs.repo}'
                  number: '${steps.pr.output.number}'
                  checks: '${steps.gated.output.0.checks.output.conclusion}'
                  review: '${steps.gated.output.0.review.output}'
                  result: '${steps.develop.output}'
                  sha: '${steps.develop.head_sha}'
                  task_id: '${steps.round.output.task_id}'
                  job_id: '${steps.develop.job_id}'
                  require_verification: true

          # The merge gate, skipped when the PR was merged on GitHub meanwhile.
          # Merging it there approves; closing it rejects. Approving here
          # merges it, unless GitHub merged it already.
          - id: approval
            type: foreach
            items: '${steps.assess.output.if_ready}'
            steps:
              - id: ready
                type: action
                action: goal.task_move
                with: {task_id: '${steps.round.output.task_id}', to: merge_ready}
              - id: merge_gate
                type: gate
                with:
                  kind: merge_approval
                  title: 'Merge ${steps.round.output.ref}: ${steps.round.output.title}'
                  summary: '${steps.assess.output.gate_summary}'
                  subject_repo: '${inputs.repo}'
                  subject_number: '${item}'
                  task_id: '${steps.round.output.task_id}'
              - id: verdict
                type: action
                action: goal.if_approved
                with: {decision: '${steps.merge_gate.output.decision}', number: '${item}'}
              # The human approved, so a failure here asks for help and never
              # undoes the approval.
              - id: merge_if
                type: foreach
                items: '${steps.verdict.output.if_approved}'
                steps:
                  - id: merge
                    type: action
                    action: github.merge_pr
                    with: {repo: '${inputs.repo}', number: '${item}', sha: '${steps.assess.output.sha}', require_verification: true}
                    on_failure: escalate
          - id: done
            type: action
            action: goal.task_done
            with:
              task_id: '${item.id}'
              repo: '${inputs.repo}'
              number: '${steps.pr.output.number}'
              feedback: '${steps.approval.output.0.merge_gate.output.feedback}'
            on_failure: escalate

  # The retro and its PR, as in the learn playbook (the steps below are its
  # steps, TestGoalV3LearnIsTheLearnPlaybooks keeps them equal). A failure
  # here does not fail the goal: a needs_you gate asks, approving it skips the
  # learn step and rejecting stops the run.
  - id: learning
    type: loop
    max_iterations: 1
    until: steps.learn_settle.output.settled
    on_failure: skip
    steps:
      - id: learn_history
        type: action
        action: goal.retro_context
        with: {goal_id: '${inputs.goal_id}'}
      # A read-only job of the curator: it proposes with kb_propose, which queues
      # the proposals for goal.learn (they belong to the goal).
      - id: learn_retro
        type: job
        with:
          role: knowledge-curator
          task: retro
          repo: '${inputs.repo}'
          goal_id: '${inputs.goal_id}'
          feedback: '${steps.learn_history.output.text}'
      - id: learn_learn
        type: action
        action: goal.learn
        with: {goal_id: '${inputs.goal_id}'}
      # A human approves the PR and the proposals that wait for a copy.
      - id: learn_human
        type: foreach
        items: '${steps.learn_learn.output.if_gate}'
        steps:
          - {id: learn_decision, type: wait, with: {signal: gate.resolved, gate_id: '${item}'}}
      - id: learn_decide
        type: action
        action: goal.learn_decide
        with: {goal_id: '${inputs.goal_id}', gate: '${steps.learn_learn.output.gate}'}
      - id: learn_merged
        type: foreach
        items: '${steps.learn_decide.output.if_merge}'
        steps:
          # The checks of the head that was approved; "none" means the repo has
          # no checks. A timeout opens a needs_you gate.
          - id: learn_checks
            type: wait
            timeout: 1h
            with: {signal: checks.completed, repo: '${inputs.repo}', sha: '${steps.learn_learn.output.head_sha}'}
          - id: learn_merge
            type: action
            action: github.merge_pr
            with: {repo: '${inputs.repo}', number: '${item}', sha: '${steps.learn_learn.output.head_sha}'}
      # CODEOWNERS reviewers approve on GitHub and a human merges.
      - id: learn_followed
        type: foreach
        items: '${steps.learn_decide.output.if_follow}'
        steps:
          - {id: learn_pr, type: wait, with: {signal: pr.merged, repo: '${inputs.repo}', number: '${item}'}}
      - id: learn_settle
        type: action
        action: goal.learn_settle
        with: {goal_id: '${inputs.goal_id}'}

  # A skipped learn step closes its PR and rejects its proposals.
  - id: learning_skipped
    type: action
    action: goal.learn_settle
    with: {goal_id: '${inputs.goal_id}', skipped: '${steps.learning.output.skipped}'}
    on_failure: escalate

  # The summary on the goal issue, with the cost of all jobs.
  - id: close
    type: action
    action: goal.close
    with: {goal_id: '${inputs.goal_id}'}
    on_failure: escalate

# A rejected or failed run cancels the goal, closes its unmerged tasks and
# closes their issues. Merged pull requests stay merged.
finally:
  - id: settle
    type: action
    action: goal.settle
    with: {goal_id: '${inputs.goal_id}'}
