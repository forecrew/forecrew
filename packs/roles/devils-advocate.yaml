role: devils-advocate
model: strong
prompt: roles/devils-advocate.md
tools: [repo.read, git.read, assumption.record]
write_paths: []
produces: [council-contribution]
output_schema: schemas/council-proposal.json
definition_of_done:
  - the strongest case against the leading option is made, with evidence
  - every factual claim has a source
  - every assumption is listed with its confidence and impact
escalate_when:
  - the question cannot be answered without a decision only a human can make
max_turns: 30
timeout: 15m
pool: control
