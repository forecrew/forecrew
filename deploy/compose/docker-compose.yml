# Forecrew: forecrewd, its Postgres, a daily database backup and a control
# worker for the read-only "control" pool.
#
#   cp .env.example .env                    # fill in the secrets
#   cp forecrew.example.yaml forecrew.yaml  # edit
#   docker compose up -d
#
# See docs/runbooks/install.md.

# Postgres is reachable only on "db", which the control worker does not join:
# agents run in that container, so it must not see the database. forecrewd
# joins "edge" too, so the control worker reaches its public API there.
networks:
  db:
    internal: true # no route outside the host
  edge: {}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    networks: [db]
    environment:
      POSTGRES_USER: forecrew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: forecrew
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecrew -d forecrew"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ghcr.io/forecrew/forecrewd:${FORECREW_VERSION:-latest}
    entrypoint: ["/usr/local/bin/forecrew"]
    command: ["migrate", "up"]
    networks: [db]
    environment:
      FORECREW_DATABASE_URL: &database_url postgres://forecrew:${POSTGRES_PASSWORD}@postgres:5432/forecrew?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  forecrewd:
    image: ghcr.io/forecrew/forecrewd:${FORECREW_VERSION:-latest}
    restart: unless-stopped
    # One replica only: forecrewd is not built to run twice against a database.
    networks: [db, edge] # edge: outbound HTTPS, and the control worker's API
    env_file: .env
    environment:
      FORECREW_DATABASE_URL: *database_url
    volumes:
      - ./forecrew.yaml:/etc/forecrew/forecrew.yaml:ro
      - certs:/var/lib/forecrew/certs
    ports:
      - "${FORECREW_HTTP_PORT:-80}:80"
      - "${FORECREW_HTTPS_PORT:-443}:443"
    # Lets the unprivileged process listen on 80 and 443.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    healthcheck:
      test: ["CMD", "/usr/local/bin/forecrewd", "healthcheck", "--config", "/etc/forecrew/forecrew.yaml"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:18
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "while true; do /backup.sh; sleep 86400; done"]
    networks: [db]
    environment:
      PGHOST: postgres
      PGUSER: forecrew
      PGDATABASE: forecrew
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-14}
    volumes:
      - ../backup/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Registers worker "control" once and keeps its token in the control-token
  # volume (see control.sh). Runs before the worker and then exits.
  control-init:
    image: ghcr.io/forecrew/forecrew-worker-control:${FORECREW_VERSION:-latest}
    command: ["init"]
    environment:
      FORECREW_DATABASE_URL: *database_url
    volumes:
      - control-token:/var/lib/forecrew-control
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Runs the read-only "control" pool next to forecrewd. It has no database
  # URL, no GitHub key and no runtime keys: forecrewd sends those with each
  # job. Its only network is edge, which holds forecrewd and nothing else
  # that matters. See docs/runbooks/install.md, Control worker.
  worker-control:
    image: ghcr.io/forecrew/forecrew-worker-control:${FORECREW_VERSION:-latest}
    restart: unless-stopped
    command: ["run"]
    # Docker's default is 10 seconds: a stop must leave running jobs their
    # 10-minute grace period, as the worker does on SIGTERM (docs/worker.md).
    stop_grace_period: 10m
    environment:
      FORECREW_CONTROL_MAX_JOBS: ${FORECREW_CONTROL_MAX_JOBS:-4}
      FORECREW_CONTROL_SERVER_URL: ${FORECREW_CONTROL_SERVER_URL:-http://forecrewd:80}
    # The entrypoint starts as root only to read the token and drop to
    # forecrew (control.sh): it needs SETUID and SETGID for that and nothing
    # else. The worker and its agents run with no capabilities.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - control-token:/var/lib/forecrew-control:ro
    networks: [edge]
    depends_on:
      control-init:
        condition: service_completed_successfully
      forecrewd:
        condition: service_healthy

volumes:
  pgdata:
  certs:
  backups:
  control-token:
